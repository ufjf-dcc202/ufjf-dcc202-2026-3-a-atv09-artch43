<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 Exemplo03</title>
    <link rel="stylesheet" href="estilo.css">
    <style>

        ul{
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul > li {
            border: 1px solid green;
            background-color: lightgreen;
        }

        .desconstructed-pancake {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .desconstructed-pancake > * {
            flex: 1 1 120px;
        }


        .sidebar-says {
            display: grid;
            grid-template-columns: minmax(9ch, 20%) 1fr;
            gap: 10px;
        }

    </style>

</head>
<body>
    <main>
        <article class="sidebar-says">
            <section>
                <ul>
                    <li>Alvinho</li>
                    <li>Marcelinho</li>
                    <li>Clebinho</li>
                    <li>Rodriguinho</li>
                </ul>
            </section>
            <section>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. 
                Corporis quaerat non doloremque illo quo, dolore iure obcaecati voluptatibus ea enim 
                harum in aperiam necessitatibus repellendus voluptate, eos assumenda nihil velit!
            </section>
        </article>
    </main>
</body>
</html>
